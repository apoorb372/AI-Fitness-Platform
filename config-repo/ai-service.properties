
spring.application.name=ai-service

server.port=8083

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.hostname=ai-service
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=ai-service:8083

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Primary AI provider: Groq
groq.api.url=https://api.groq.com/openai/v1
groq.api.model=openai/gpt-oss-120b
groq.api.key=${GROQ_API_KEY:}

# Secondary AI provider: Gemini
gemini.api.url=https://generativelanguage.googleapis.com/v1beta
gemini.api.model=gemini-3.7-flash
gemini.api.key=${GEMINI_API_KEY:}
