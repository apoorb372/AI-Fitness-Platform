name: ai-fitness-platform

services:

  eureka-server:
    build:
      context: ./eureka-server
    container_name: eureka-server
    ports:
      - "8762:8761"
    environment:
      SERVER_PORT: 8761
    networks:
      - ai-fitness-network
    restart: unless-stopped

  config-server:
    build:
      context: ./config-server
    container_name: config-server
    ports:
      - "8889:8888"
    volumes:
      - ./config-repo:/config-repo:ro
    environment:
      SERVER_PORT: 8888
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config-repo
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - ai-fitness-network
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: ai-fitness-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ai_fitness_db
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - ai-fitness-network
    restart: unless-stopped

  mongodb:
    image: mongo:8
    container_name: ai-fitness-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - ai-fitness-network
    restart: unless-stopped

  user-service:
    build:
      context: ./user-service
    container_name: user-service
    ports:
      - "8086:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ai_fitness_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started
    networks:
      - ai-fitness-network
    restart: unless-stopped

  activity-service:
    build:
      context: ./activity-service
    container_name: activity-service
    ports:
      - "8085:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/ai_fitness_db
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      mongodb:
        condition: service_healthy
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started
    networks:
      - ai-fitness-network
    restart: unless-stopped


  ai-service:
    build:
      context: ./ai-service
    container_name: ai-service
    ports:
      - "8084:8083"
    environment:
      SERVER_PORT: 8083
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      - config-server
      - eureka-server
    networks:
      - ai-fitness-network
    restart: unless-stopped


  api-gateway:
    build:
      context: "./api-gateway (1)"
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:9090/realms/ai-fitness
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/ai-fitness/protocol/openid-connect/certs
    depends_on:
      - config-server
      - eureka-server
      - user-service
      - activity-service
      - ai-service
    networks:
      - ai-fitness-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: ai-fitness-frontend
    ports:
      - "5173:80"
    depends_on:
      - api-gateway
    networks:
      - ai-fitness-network
    restart: unless-stopped

networks:
  ai-fitness-network:
    external: true
    name: ai-fitness-network

volumes:
  mysql-data:
  mongodb-data: